<!DOCTYPE html>

<head>

<title>$CARABAO — Slow Pull. Heavy Conviction.</title>

<meta property="og:title" content="$CARABAO — Slow Pull. Heavy Conviction." />
<meta property="og:description" content="No fake urgency. No daily noise. Built for the long walk." />
<meta property="og:image" content="carabaopulling.jpg" />

<style>
:root{
--yellow:#f5c400;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui;}

body{
color:#fff;
background:
linear-gradient(rgba(255,200,120,.28),rgba(0,0,0,.65)),
url("carabaopulling.jpg") center bottom/cover no-repeat fixed;
}

.hero{min-height:100svh;display:flex;align-items:center}
.hero-inner{max-width:1100px;padding:32px}

.hero h1{font-size:clamp(40px,7vw,72px);font-weight:900}
.hero p{margin-top:12px;font-size:18px;max-width:520px}

.buttons{margin-top:24px;display:flex;gap:14px;flex-wrap:wrap}

.btn{
background:var(--yellow);
color:#000;
padding:14px 22px;
border-radius:999px;
font-weight:800;
text-decoration:none;
}

.section{max-width:1000px;margin:auto;padding:32px}

.card{
background:rgba(0,0,0,.65);
border-radius:18px;
padding:22px;
backdrop-filter:blur(6px);
margin-bottom:32px;
}

.chart{width:100%;height:420px;border-radius:14px;overflow:hidden}

.token{
font-family:monospace;
word-break:break-all;
background:rgba(0,0,0,.5);
padding:12px;
border-radius:10px;
}

.sticky{
position:fixed;
bottom:14px;
left:50%;
transform:translateX(-50%);
z-index:999;
}

.music-toggle{
position:fixed;
top:16px;
right:16px;
background:#000;
border:1px solid #333;
padding:10px 14px;
border-radius:999px;
cursor:pointer;
font-weight:700;
}
</style>
</head>

<body>

<!-- 🎵 BACKGROUND MUSIC -->
<audio id="bgMusic" loop preload="auto">
<source src="carabao-music.mp3" type="audio/mpeg">
</audio>

<div class="music-toggle" id="musicBtn">🔊 Sound</div>

<!-- HERO -->
<section class="hero">
<div class="hero-inner">
<h1>$CARABAO</h1>
<p>Slow pull. Heavy conviction.<br>Diamond hands don’t rush.</p>

<div class="buttons">
<a class="btn" href="#chart">Live Chart</a>
<a class="btn" href="https://pump.fun" target="_blank">Swap $CARABAO</a>
</div>
</div>
</section>

<div class="section">

<div class="card">
<h2>Token Address</h2>
<div class="token">
92kiHVStMPbuMas3BXRoqUgJN6HCUzRUQ8u2gHmSpump
</div>
</div>

<div class="card">
<h2>🎧 CARABAO Anthem</h2>
<audio controls preload="metadata" style="width:100%">
<source src="carabao-music.mp3" type="audio/mpeg">
</audio>
</div>

<div class="card" id="chart">
<h2>Live Chart</h2>
<div class="chart">
<iframe
src="https://dexscreener.com/solana/92kiHVStMPbuMas3BXRoqUgJN6HCUzRUQ8u2gHmSpump?embed=1&theme=dark"
width="100%"
height="100%"
frameborder="0"></iframe>
</div>
</div>

</div>

<div class="sticky">
<a class="btn" href="https://pump.fun" target="_blank">Swap $CARABAO</a>
</div>

<!-- ✅ SAFE BACKGROUND MUSIC SCRIPT -->
<script>
document.addEventListener("DOMContentLoaded",()=>{

const music=document.getElementById("bgMusic");
const btn=document.getElementById("musicBtn");

music.volume=0.35;
music.muted=true;

// muted autoplay allowed
music.play().catch(()=>{});

// enable sound after first interaction
const enableSound=()=>{
music.muted=false;
music.play().catch(()=>{});
btn.innerText="🔊 Sound ON";
window.removeEventListener("click",enableSound);
window.removeEventListener("touchstart",enableSound);
};

window.addEventListener("click",enableSound,{once:true});
window.addEventListener("touchstart",enableSound,{once:true});

// manual toggle button
btn.addEventListener("click",()=>{
if(music.muted){
music.muted=false;
music.play();
btn.innerText="🔊 Sound ON";
}else{
music.muted=true;
btn.innerText="🔇 Muted";
}
});

});
</script>

</body>
</html>
