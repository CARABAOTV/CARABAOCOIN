<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>$CARABAO — Slow Pull. Heavy Conviction.</title>

<style>
:root{
--yellow:#f5c400;
--bg:#0a0a0a;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}

html{scroll-behavior:smooth}

body{
color:#fff;
background:#000;
overflow-x:hidden;
}

/* PARALLAX BACKGROUND */
.bg{
position:fixed;
inset:0;
background:
linear-gradient(rgba(255,180,60,.25),rgba(0,0,0,.8)),
url("carabaopulling.jpg") center/cover no-repeat;
transform:scale(1.1);
z-index:-1;
}

/* HERO */
.hero{
min-height:100svh;
display:flex;
align-items:center;
padding:40px;
}

.hero-inner{
max-width:1100px;
animation:heroFloat 6s ease-in-out infinite;
}

@keyframes heroFloat{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-10px)}
}

.hero h1{
font-size:clamp(48px,8vw,88px);
font-weight:900;
text-shadow:0 0 25px rgba(245,196,0,.6);
}

.hero p{
margin-top:14px;
font-size:18px;
max-width:520px;
opacity:.9;
}

/* BUTTON */
.btn{
display:inline-block;
margin-top:26px;
background:linear-gradient(90deg,#f5c400,#ffd84d);
color:#000;
padding:16px 28px;
border-radius:999px;
font-weight:900;
text-decoration:none;
box-shadow:0 10px 40px rgba(245,196,0,.4);
}

/* CARDS */
.section{max-width:1000px;margin:auto;padding:32px}

.card{
background:rgba(0,0,0,.65);
backdrop-filter:blur(8px);
padding:24px;
border-radius:20px;
margin-bottom:28px;
border:1px solid rgba(255,255,255,.05);
}

/* HOLDER COUNTER */
.counter{
font-size:42px;
font-weight:900;
color:var(--yellow);
}

/* WHALE BANNER */
.whale{
position:fixed;
top:0;
width:100%;
background:#000;
border-bottom:1px solid #222;
padding:10px;
overflow:hidden;
white-space:nowrap;
}

.whale span{
display:inline-block;
padding-left:100%;
animation:whale 18s linear infinite;
color:#ffd84d;
font-weight:700;
}

@keyframes whale{
0%{transform:translateX(0)}
100%{transform:translateX(-100%)}
}

/* MUSIC BUTTON */
.music{
position:fixed;
top:50px;
right:16px;
background:#000;
border:1px solid #333;
padding:10px 14px;
border-radius:999px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="whale">
<span>🐋 Whale bought 2.4M CARABAO • New holder joined • Diamond hands detected • Smart money accumulating</span>
</div>

<!-- 🎵 MUSIC -->
<audio id="bgMusic" loop preload="auto">
<source src="carabao-music.mp3" type="audio/mpeg">
</audio>

<div class="music" id="musicBtn">🔊</div>

<!-- HERO -->
<section class="hero">
<div class="hero-inner">
<h1>$CARABAO</h1>
<p>Slow pull. Heavy conviction.<br>Diamond hands don’t rush.</p>
<a class="btn" href="https://pump.fun" target="_blank">Buy $CARABAO</a>
</div>
</section>

<div class="section">

<div class="card">
<h2>Holders</h2>
<div class="counter" id="holders">1270</div>
</div>

<div class="card">
<h2>Token Address</h2>
<code>92kiHVStMPbuMas3BXRoqUgJN6HCUzRUQ8u2gHmSpump</code>
</div>

<div class="card">
<h2>Live Chart</h2>
<iframe
src="https://dexscreener.com/solana/92kiHVStMPbuMas3BXRoqUgJN6HCUzRUQ8u2gHmSpump?embed=1&theme=dark"
width="100%"
height="420"
frameborder="0"></iframe>
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

/* MUSIC FADE IN */
const music=document.getElementById("bgMusic");
const btn=document.getElementById("musicBtn");

music.volume=0;
music.muted=true;
music.play().catch(()=>{});

const fadeIn=()=>{
music.muted=false;
let v=0;
const i=setInterval(()=>{
v+=0.02;
music.volume=Math.min(v,.35);
if(v>=.35) clearInterval(i);
},120);
};

window.addEventListener("click",fadeIn,{once:true});
window.addEventListener("touchstart",fadeIn,{once:true});

btn.onclick=()=>{
music.muted=!music.muted;
};

/* HOLDER COUNTER AUTO INCREMENT */
const el=document.getElementById("holders");
let value=parseInt(el.innerText);

setInterval(()=>{
value+=Math.random()<.5?1:0;
el.innerText=value;
},6000);

/* PARALLAX */
window.addEventListener("scroll",()=>{
document.querySelector(".bg").style.transform=
`scale(1.1) translateY(${window.scrollY*0.15}px)`;
});

});
</script>

</body>
</html>
